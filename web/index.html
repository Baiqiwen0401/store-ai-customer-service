<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悦己美容院 AI 客服</title>
  <style>
    :root{--ink:#382f2b;--muted:#7f7470;--line:#eadfd9;--canvas:#f8f4f0;--paper:#fffdfa;--rose:#9b625f;--rose-deep:#754946;--rose-soft:#f6e9e5;--sage:#dce9df;--sage-ink:#34604f;--gold:#a76f3a;--gold-soft:#fff1df;--red:#a14d4b;--red-soft:#fbe9e6}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1240px;margin:auto;padding:18px}.mast{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--rose);color:#fff;font-weight:700}.brand h1{font-size:18px;margin:0;line-height:1.2}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.status{font-size:12px;color:var(--sage-ink)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0}.tab{border:0;background:transparent;padding:8px 2px 10px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--rose-deep);border-color:var(--rose)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.surface{background:var(--paper);border:1px solid var(--line);border-radius:10px}.chat-head{padding:21px 22px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#fffdfa,#fdf4ef)}.chat-head h2{margin:0;font-size:21px;font-weight:600}.chat-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.messages{height:430px;overflow:auto;padding:20px 22px}.msg{max-width:83%;margin:0 0 15px}.msg.user{margin-left:auto}.bubble{padding:11px 13px;border-radius:12px;white-space:pre-wrap}.msg.ai .bubble{background:var(--rose-soft);border-top-left-radius:3px}.msg.user .bubble{background:var(--rose);color:#fff;border-top-right-radius:3px}.meta{margin-top:3px;color:var(--muted);font-size:11px}.msg.user .meta{text-align:right}.compose{padding:14px 20px 17px;border-top:1px solid var(--line)}.identity{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-bottom:8px}.field{width:100%;border:1px solid #d8c9c2;border-radius:7px;padding:9px 10px;background:#fff;color:var(--ink)}.field:focus{outline:2px solid #efd5cd;border-color:var(--rose)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.primary,.secondary{border-radius:7px;padding:9px 15px;font-weight:600}.primary{background:var(--rose);border:1px solid var(--rose);color:#fff}.primary:hover{background:var(--rose-deep)}.secondary{background:#fff;border:1px solid #d8c9c2;color:var(--ink)}.consent{display:flex;gap:7px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px}.notice{margin:0;padding:11px 15px;background:var(--gold-soft);border-left:3px solid #d2a367;color:#72552e;font-size:12px}.aside{display:grid;gap:14px}.aside section{padding:16px}.aside h3{margin:0 0 9px;font-size:12px;color:var(--muted);letter-spacing:.06em}.line{padding:7px 0;border-bottom:1px solid #f0e8e4}.line:last-child{border:0}.quick{display:grid;gap:7px}.quick button{text-align:left;padding:9px 10px;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--ink)}.quick button:hover{border-color:var(--rose);color:var(--rose-deep)}.work-top{display:flex;justify-content:space-between;align-items:end;margin:2px 0 14px}.work-top h2{margin:0;font-size:21px}.work-top p{margin:3px 0 0;color:var(--muted)}.health{font-size:12px;color:var(--muted);text-align:right}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.metric{padding:14px 15px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.metric b{display:block;font-size:24px;line-height:1.1}.metric span{font-size:12px;color:var(--muted)}.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-width:0}.panel>header{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:700}.list{padding:2px 15px 12px;max-height:310px;overflow:auto}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item p{margin:4px 0}.small{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:600;margin-right:5px}.pending,.candidate,.draft{background:var(--gold-soft);color:var(--gold)}.handoff{background:var(--red-soft);color:var(--red)}.approved,.published{background:var(--sage);color:var(--sage-ink)}.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.conversation{padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer}.conversation.selected{background:var(--rose-soft)}.detail{padding:12px 15px;border-top:1px solid var(--line)}.detail h4{margin:0 0 7px}.detail-msg{padding:7px 8px;margin:5px 0;border-radius:6px;background:#faf5f2}.detail-msg.human{background:var(--sage)}.reply-box{display:grid;gap:7px;margin-top:8px}.kb-form{padding:13px 15px;border-bottom:1px solid var(--line);display:grid;gap:7px}.kb-form textarea{min-height:76px;resize:vertical}.empty{padding:15px 0;color:var(--muted)}@media(max-width:850px){.grid,.work-grid{grid-template-columns:1fr}.aside{order:initial}.metrics{grid-template-columns:repeat(2,1fr)}.work-top{align-items:flex-start;flex-direction:column}.health{text-align:left;margin-top:5px}}@media(max-width:520px){.app{padding:11px}.status{display:none}.identity,.row{grid-template-columns:1fr}.messages{height:350px}.primary{min-height:42px}.metrics{gap:7px}.metric{padding:11px 9px}.metric b{font-size:21px}}
  </style>
</head>
<body><main class="app">
  <header class="mast"><div class="brand"><div class="mark">YJ</div><div><h1 id="storeName">悦己美容院</h1><p>专业护理 · 在线咨询</p></div></div><div class="status">● 本地服务运行中</div></header>
  <nav class="tabs" aria-label="视图切换"><button class="tab" aria-selected="true" data-view="consult">在线咨询</button><button class="tab" aria-selected="false" data-view="workspace">门店工作台</button></nav>
  <section id="consult" class="view active"><div class="grid"><section class="surface"><header class="chat-head"><h2>您好，有什么可以帮您？</h2><p>项目、价格、营业时间、预约意向和护理注意事项都可以咨询。</p></header><div id="messages" class="messages" aria-live="polite"><div class="msg ai"><div class="bubble">您好，我是悦己美容院 AI 客服。您可以咨询项目、价格、注意事项或预约。</div></div></div><div class="compose"><div class="identity"><input id="name" class="field" placeholder="称呼（可选）"><input id="phone" class="field" placeholder="手机号（同意后用于长期记忆）" inputmode="tel"></div><div class="row"><input id="input" class="field" placeholder="例如：门店有哪些项目？"><button id="send" class="primary" type="button">发送</button></div><label class="consent"><input id="consent" type="checkbox">我同意门店为本次咨询和后续服务保存必要客户记忆</label></div><p class="notice">AI 提供门店资料与一般护理信息，不替代专业诊断或治疗建议。</p></section><aside class="aside"><section class="surface"><h3>门店信息</h3><div id="storeInfo"></div></section><section class="surface"><h3>常见咨询</h3><div class="quick"><button data-q="门店有哪些项目？">门店有哪些项目？</button><button data-q="深层清洁多少钱？">深层清洁多少钱？</button><button data-q="周六下午可以预约吗？">周六下午可以预约吗？</button></div></section></aside></div></section>
  <section id="workspace" class="view"><div class="work-top"><div><h2>门店工作台</h2><p>处理人工接管、预约跟进、记忆审核和知识发布。</p></div><div id="modelStatus" class="health">模型状态检查中...</div></div><div class="metrics"><div class="metric"><b id="customerCount">0</b><span>客户档案</span></div><div class="metric"><b id="taskCount">0</b><span>待跟进</span></div><div class="metric"><b id="memoryCount">0</b><span>待审核记忆</span></div><div class="metric"><b id="handoffCount">0</b><span>人工会话</span></div></div><div class="work-grid"><section class="panel"><header>人工会话</header><div id="conversations"></div><div id="conversationDetail" class="detail" hidden></div></section><section class="panel"><header>预约与跟进</header><div id="tasks" class="list"></div></section><section class="panel"><header>客户记忆审核</header><div id="memories" class="list"></div></section><section class="panel"><header>知识库</header><div class="kb-form"><input id="kbTitle" class="field" placeholder="标题，例如：节假日预约规则"><textarea id="kbContent" class="field" placeholder="填写已确认、可公开的门店资料"></textarea><select id="kbIntent" class="field"><option value="">通用资料</option><option value="services">项目</option><option value="price">价格</option><option value="appointment">预约</option><option value="precautions">注意事项</option><option value="address">地址</option><option value="hours">营业时间</option></select><button id="kbAdd" class="primary" type="button">保存为草稿</button></div><div id="knowledge" class="list"></div></section></div></section>
  </main><script>
    const $=id=>document.getElementById(id);let conversationId=null,customerId=null,selectedConversation=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,opt){const r=await fetch(path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function add(role,text,meta=''){const e=document.createElement('div');e.className='msg '+role;e.innerHTML='<div class="bubble"></div>'+(meta?'<div class="meta"></div>':'');e.querySelector('.bubble').textContent=text;if(meta)e.querySelector('.meta').textContent=meta;$('messages').appendChild(e);$('messages').scrollTop=$('messages').scrollHeight;return e}
    async function send(){const input=$('input'),message=input.value.trim();if(!message)return;if($('phone').value&&!$('consent').checked){add('ai','如需使用手机号保存长期记忆，请先勾选同意；也可以清空手机号匿名咨询。');return}add('user',message);input.value='';$('send').disabled=true;const p=add('ai','正在处理...');try{const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,name:$('name').value.trim()||null,phone:$('phone').value.trim()||null,memory_consent:$('consent').checked,customer_id:customerId,conversation_id:conversationId,channel:'web'})});p.remove();conversationId=d.conversation_id;customerId=d.customer_id;const labels={knowledge_direct:'门店资料直答',model_assisted:'AI 辅助分析',risk_handoff:'已转人工',handoff_fallback:'已转人工确认',human_waiting:'等待人工回复'};add('ai',d.answer,labels[d.reply_mode]||'AI 回复');refresh()}catch(e){p.remove();add('ai','系统暂时无法响应：'+e.message)}finally{$('send').disabled=false}}
    function view(v){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id===v));if(v==='workspace')refresh()}
    async function refresh(){try{const [store,customers,tasks,mems,convs,kb,ms]=await Promise.all([api('/api/store'),api('/api/customers'),api('/api/tasks'),api('/api/memories'),api('/api/conversations'),api('/api/knowledge'),api('/api/model-status')]);$('storeName').textContent=store.name;$('storeInfo').innerHTML=['营业时间：'+esc(store.business_hours),'地址：'+esc(store.address),'电话：'+esc(store.phone)].map(x=>'<div class="line">'+x+'</div>').join('');$('customerCount').textContent=customers.length;$('taskCount').textContent=tasks.filter(x=>x.status==='pending').length;$('memoryCount').textContent=mems.filter(x=>x.status==='candidate').length;$('handoffCount').textContent=convs.filter(x=>['handoff','human'].includes(x.status)).length;$('modelStatus').textContent=ms.configured?'模型：'+esc(ms.model)+' · '+(ms.outcome==='success'?'最近调用正常':'最近状态：'+esc(ms.outcome)):'模型未配置，复杂问题将转人工';$('tasks').innerHTML=tasks.length?tasks.map(x=>'<div class="item"><span class="tag '+x.status+'">'+(x.status==='pending'?'待跟进':esc(x.status))+'</span><p>'+esc(x.summary)+'</p>'+(x.status==='pending'?'<div class="actions"><button class="secondary" data-task="'+x.task_id+'">标记完成</button></div>':'')+'</div>').join(''):'<div class="empty">暂无待跟进事项</div>';$('memories').innerHTML=mems.length?mems.map(x=>'<div class="item"><span class="tag '+x.status+'">'+(x.status==='candidate'?'待审核':esc(x.status))+'</span><p>'+esc(x.content)+'</p><div class="small">客户：'+esc(x.name||'匿名')+'</div>'+(x.status==='candidate'?'<div class="actions"><button class="primary" data-memory="'+x.memory_id+'" data-action="approve">确认</button><button class="secondary" data-memory="'+x.memory_id+'" data-action="reject">拒绝</button></div>':'')+'</div>').join(''):'<div class="empty">暂无客户记忆</div>';$('knowledge').innerHTML=kb.length?kb.map(x=>'<div class="item"><span class="tag '+x.status+'">'+esc(x.status==='published'?'已发布':'草稿')+'</span><b>'+esc(x.title)+'</b><p>'+esc(x.content)+'</p>'+(x.status==='draft'?'<div class="actions"><button class="secondary" data-kb="'+x.knowledge_id+'">发布</button></div>':'')+'</div>').join(''):'<div class="empty">暂无知识资料</div>';$('conversations').innerHTML=convs.length?convs.map(x=>'<div class="conversation '+(selectedConversation==x.conversation_id?'selected':'')+'" data-conv="'+x.conversation_id+'"><span class="tag '+x.status+'">'+({handoff:'待接管',human:'人工中',open:'AI处理中',closed:'已结束'}[x.status]||x.status)+'</span><b>'+esc(x.name||x.phone||'匿名客户')+'</b><div class="small">'+esc(x.last_message||'')+'</div></div>').join(''):'<div class="empty">暂无会话</div>';if(selectedConversation)loadConversation(selectedConversation)}catch(e){console.error(e)}}
    async function loadConversation(id){const d=await api('/api/conversations/'+id);selectedConversation=id;const c=d.conversation;$('conversationDetail').hidden=false;$('conversationDetail').innerHTML='<h4>'+esc(c.name||c.phone||'匿名客户')+' · '+esc(c.status)+'</h4><div class="small">'+esc(c.handoff_reason||'')+'</div><div>'+d.messages.map(m=>'<div class="detail-msg '+(m.role==='human'?'human':'')+'"><b>'+({user:'客户',assistant:'AI',human:'员工'}[m.role]||m.role)+'</b>：'+esc(m.content)+'</div>').join('')+'</div><div class="actions">'+(c.status==='handoff'?'<button class="primary" data-claim="'+id+'">认领会话</button>':'')+(c.status==='human'?'<button class="secondary" data-resume="'+id+'">恢复 AI</button><button class="secondary" data-close="'+id+'">结束会话</button>':'')+'</div><div class="reply-box">'+(c.status==='human'?'<textarea id="staffReply" class="field" placeholder="输入员工回复"></textarea><button class="primary" data-reply="'+id+'">发送员工回复</button>':'')+'</div>'}
    async function addKnowledge(){const title=$('kbTitle').value.trim(),content=$('kbContent').value.trim();if(!title||!content)return;await api('/api/knowledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,content,intent:$('kbIntent').value,status:'draft'})});$('kbTitle').value='';$('kbContent').value='';refresh()}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.q;$('input').focus()});$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter')send()};$('kbAdd').onclick=addKnowledge;document.addEventListener('click',async e=>{const t=e.target;try{if(t.dataset.task)await api('/api/tasks/'+t.dataset.task+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(t.dataset.memory)await api('/api/memories/'+t.dataset.memory+'/'+t.dataset.action,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(t.dataset.kb)await api('/api/knowledge/'+t.dataset.kb+'/publish',{method:'PUT',headers:{'Content-Type':'application/json'},body:'{}'});if(t.dataset.conv){selectedConversation=t.dataset.conv;loadConversation(t.dataset.conv)}if(t.dataset.claim)await api('/api/conversations/'+t.dataset.claim+'/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignee:'门店员工'})});if(t.dataset.reply)await api('/api/conversations/'+t.dataset.reply+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:$('staffReply').value,actor:'门店员工'})});if(t.dataset.resume)await api('/api/conversations/'+t.dataset.resume+'/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(t.dataset.close)await api('/api/conversations/'+t.dataset.close+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()}catch(err){alert(err.message)}});refresh();
  </script>
</body></html>
