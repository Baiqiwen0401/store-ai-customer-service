<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>悦己美容馆 · 在线咨询</title>
  <style>
    :root{--ink:#19303a;--muted:#64727a;--line:#dce5e6;--canvas:#f5f8f8;--paper:#fff;--teal:#087c75;--teal-deep:#075e59;--teal-soft:#e5f5f1;--amber:#9b6500;--amber-soft:#fff4db;--red:#a03a35;--red-soft:#fdeceb;--green:#1d7650;--green-soft:#e7f6ed}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:0 auto;padding:20px}.masthead{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 18px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--teal);color:#fff;font-weight:700;border-radius:6px}.brand-name{font-size:18px;font-weight:700;line-height:1.2}.brand-sub{font-size:12px;color:var(--muted)}.session{font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px}.session i{width:7px;height:7px;background:var(--green);border-radius:50%}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:18px 0}.tab{border:0;background:transparent;color:var(--muted);padding:9px 2px 10px;font-weight:600;border-bottom:2px solid transparent}.tab[aria-selected="true"]{color:var(--teal-deep);border-color:var(--teal)}.view{display:none}.view.active{display:block}
    .consult-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}.chat-surface,.workspace-section{background:var(--paper);border:1px solid var(--line);border-radius:7px}.chat-title{padding:18px 20px 14px;border-bottom:1px solid var(--line)}.chat-title h1{font-size:20px;margin:0 0 3px}.chat-title p{margin:0;color:var(--muted);font-size:13px}.messages{min-height:385px;max-height:490px;overflow:auto;padding:20px}.message{max-width:82%;margin-bottom:14px}.bubble{padding:10px 12px;border-radius:7px;white-space:pre-wrap}.from-ai .bubble{background:var(--teal-soft);border-top-left-radius:2px}.from-user{margin-left:auto}.from-user .bubble{background:var(--teal);color:#fff;border-top-right-radius:2px}.message-meta{font-size:11px;color:var(--muted);margin-top:4px}.from-user .message-meta{text-align:right}.composer{border-top:1px solid var(--line);padding:14px 20px 16px}.identity{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-bottom:9px}.field{width:100%;border:1px solid #c8d4d6;border-radius:5px;padding:9px 10px;color:var(--ink);background:#fff}.field:focus{outline:2px solid #b9e2dc;border-color:var(--teal)}.message-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.primary{background:var(--teal);color:#fff;border:1px solid var(--teal);border-radius:5px;padding:9px 16px;font-weight:600}.primary:hover{background:var(--teal-deep)}.secondary{background:#fff;color:var(--ink);border:1px solid #c8d4d6;border-radius:5px;padding:6px 9px}.consent{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:9px}.consent input{width:15px;height:15px}.safety{font-size:12px;color:#735719;padding:12px 14px;background:var(--amber-soft);border-left:3px solid #d69a21;margin:0}
    .aside-stack{display:grid;gap:14px}.aside-block{padding:16px 17px;border-bottom:1px solid var(--line)}.aside-block:last-child{border-bottom:0}.aside-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:9px}.info-line{padding:7px 0;border-bottom:1px solid #edf1f1}.info-line:last-child{border-bottom:0}.quick{display:grid;gap:7px}.quick button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 10px;color:var(--ink)}.quick button:hover{border-color:var(--teal);color:var(--teal-deep)}.workspace-top{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:4px 0 16px}.workspace-top h1{font-size:21px;margin:0}.workspace-top p{margin:3px 0 0;color:var(--muted)}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:15px}.metric b{font-size:25px;line-height:1.1;display:block}.metric span{font-size:12px;color:var(--muted)}.workspace-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.workspace-section header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}.queue{padding:2px 16px 12px;max-height:300px;overflow:auto}.queue-item{padding:12px 0;border-bottom:1px solid var(--line)}.queue-item:last-child{border-bottom:0}.queue-item p{margin:5px 0 0}.queue-meta{font-size:12px;color:var(--muted)}.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-right:5px}.tag.pending,.tag.candidate{color:var(--amber);background:var(--amber-soft)}.tag.handoff{color:var(--red);background:var(--red-soft)}.tag.approved{color:var(--green);background:var(--green-soft)}.item-actions{display:flex;gap:6px;margin-top:8px}.empty{padding:16px 0;color:var(--muted)}.knowledge-form{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}.knowledge-form textarea{min-height:76px;resize:vertical}.knowledge-list{padding:2px 16px 12px;max-height:270px;overflow:auto}.knowledge-item{padding:10px 0;border-bottom:1px solid var(--line)}.knowledge-item:last-child{border-bottom:0}.knowledge-item p{margin:4px 0 0;color:var(--muted);font-size:12px}.model-note{font-size:12px;color:var(--muted)}
    @media(max-width:820px){.app{padding:12px}.masthead{align-items:flex-start}.consult-layout,.workspace-grid{grid-template-columns:1fr}.aside-stack{order:-1}.overview{grid-template-columns:repeat(3,1fr)}.messages{min-height:340px}.workspace-top{align-items:flex-start;flex-direction:column}.chat-surface{order:1}}@media(max-width:520px){.masthead{padding-bottom:13px}.brand-mark{width:30px;height:30px}.session{display:none}.tabs{margin:13px 0}.identity{grid-template-columns:1fr}.message-row{grid-template-columns:1fr}.primary{min-height:42px}.overview{gap:7px}.metric{padding:12px 9px}.metric b{font-size:21px}.metric span{font-size:11px}.chat-title h1,.workspace-top h1{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead"><div class="brand"><div class="brand-mark">YJ</div><div><div id="storeName" class="brand-name">悦己美容馆</div><div class="brand-sub">专业护理 · 在线咨询</div></div></div><div class="session"><i></i>本地试用服务运行中</div></header>
    <nav class="tabs" aria-label="视图切换"><button class="tab" aria-selected="true" data-view="consult">在线咨询</button><button class="tab" aria-selected="false" data-view="workspace">门店工作台</button></nav>
    <section id="consult" class="view active"><div class="consult-layout"><section class="chat-surface"><header class="chat-title"><h1>你好，有什么可以帮你？</h1><p>咨询项目、价格、到店时间或护理注意事项。</p></header><div id="messages" class="messages" aria-live="polite"><div class="message from-ai"><div class="bubble">您好，我是悦己美容馆 AI 客服。您可以咨询项目、价格、注意事项或预约。</div></div></div><div class="composer"><div class="identity"><input id="name" class="field" placeholder="称呼（可选）" autocomplete="name" /><input id="phone" class="field" placeholder="手机号（用于保存记忆）" inputmode="tel" autocomplete="tel" /></div><div class="message-row"><input id="input" class="field" placeholder="例如：我是敏感肌，周六下午想做补水" /><button id="sendButton" class="primary" type="button">发送</button></div><label class="consent"><input id="consent" type="checkbox" />我同意门店为本次咨询和后续服务保存必要客户记忆</label></div><p class="safety">AI 提供的是门店资料与一般护理信息，不替代专业诊断或治疗建议。</p></section><aside class="chat-surface aside-stack"><section class="aside-block"><div class="aside-title">门店信息</div><div id="storeInfo"></div></section><section class="aside-block"><div class="aside-title">常见咨询</div><div class="quick"><button type="button" data-question="深层清洁多少钱？">深层清洁多少钱？</button><button type="button" data-question="营业时间是几点？">营业时间是几点？</button><button type="button" data-question="周六下午可以预约吗？">周六下午可以预约吗？</button></div></section></aside></div></section>
    <section id="workspace" class="view"><header class="workspace-top"><div><h1>门店工作台</h1><p>审核客户记忆、处理预约意向和补充已确认资料。</p></div><div class="model-note">高频资料直答 · 复杂咨询调用模型</div></header><div class="overview"><div class="metric"><b id="customerCount">0</b><span>客户档案</span></div><div class="metric"><b id="taskCount">0</b><span>待跟进</span></div><div class="metric"><b id="memoryCount">0</b><span>待审核记忆</span></div></div><div class="workspace-grid"><section class="workspace-section"><header>预约与跟进</header><div id="tasks" class="queue"></div></section><section class="workspace-section"><header>转人工会话</header><div id="handoffs" class="queue"></div></section><section class="workspace-section"><header>客户记忆审核</header><div id="memories" class="queue"></div></section><section class="workspace-section"><header>门店知识维护</header><div class="knowledge-form"><input id="knowledgeTitle" class="field" placeholder="例如：节假日预约规则" /><textarea id="knowledgeContent" class="field" placeholder="填写已确认、可对客户公开的门店资料"></textarea><button id="knowledgeButton" class="primary" type="button">发布知识</button></div><div id="knowledge" class="knowledge-list"></div></section></div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let conversationId=null,customerId=null;const escapeHtml=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function api(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data}
    function addMessage(role,text,meta=''){const root=document.createElement('div');root.className='message '+(role==='user'?'from-user':'from-ai');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;root.appendChild(bubble);if(meta){const detail=document.createElement('div');detail.className='message-meta';detail.textContent=meta;root.appendChild(detail)}$('messages').appendChild(root);$('messages').scrollTop=$('messages').scrollHeight;return root}
    async function send(){const input=$('input'),message=input.value.trim(),phone=$('phone').value.trim(),consent=$('consent').checked;if(!message)return;if(phone&&!consent){addMessage('ai','如需使用手机号保存长期记忆，请先勾选同意；也可以清空手机号后匿名咨询。');return}addMessage('user',message);input.value='';const button=$('sendButton');button.disabled=true;button.textContent='处理中';const pending=addMessage('ai','正在查询门店资料…');try{const data=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,name:$('name').value.trim()||null,phone:phone||null,memory_consent:consent,customer_id:customerId,conversation_id:conversationId,channel:'web'})});pending.remove();conversationId=data.conversation_id;customerId=data.customer_id;const mode={knowledge_direct:'门店资料直答',model_assisted:'AI 辅助分析',knowledge_fallback:'门店资料回答',appointment_fallback:'预约意向登记',risk_handoff:'已转人工',handoff_fallback:'已转人工'}[data.reply_mode]||'AI 回复';addMessage('ai',data.answer,mode+(data.handoff?' · 已转人工':''));refresh()}catch(error){pending.remove();addMessage('ai','系统暂时无法响应：'+error.message)}finally{button.disabled=false;button.textContent='发送'}}
    function setView(view){document.querySelectorAll('.tab').forEach(button=>button.setAttribute('aria-selected',button.dataset.view===view));document.querySelectorAll('.view').forEach(section=>section.classList.toggle('active',section.id===view));if(view==='workspace')refresh()}
    async function refresh(){try{const [store,customers,tasks,memories,conversations,knowledge]=await Promise.all([api('/api/store'),api('/api/customers'),api('/api/tasks'),api('/api/memories'),api('/api/conversations'),api('/api/knowledge')]);$('storeName').textContent=store.name;$('storeInfo').innerHTML=`<div class="info-line">${escapeHtml(store.business_hours||'营业时间待配置')}</div><div class="info-line">${escapeHtml(store.address||'地址待配置')}</div><div class="info-line">${escapeHtml(store.phone||'联系电话待配置')}</div>`;$('customerCount').textContent=customers.length;$('taskCount').textContent=tasks.filter(item=>item.status==='pending').length;$('memoryCount').textContent=memories.filter(item=>item.status==='candidate').length;$('tasks').innerHTML=tasks.length?tasks.map(item=>`<div class="queue-item"><span class="tag ${item.status}">${item.status==='pending'?'待跟进':escapeHtml(item.status)}</span><p>${escapeHtml(item.summary)}</p>${item.status==='pending'?`<div class="item-actions"><button class="secondary" type="button" data-task="${item.task_id}">标记完成</button></div>`:''}</div>`).join(''):'<div class="empty">暂无待跟进事项</div>';const handoffs=conversations.filter(item=>item.status==='handoff');$('handoffs').innerHTML=handoffs.length?handoffs.map(item=>`<div class="queue-item"><span class="tag handoff">需接管</span><b>${escapeHtml(item.name||item.phone||'匿名客户')}</b><p class="queue-meta">${escapeHtml(item.handoff_reason||'需人工处理')}</p><p>${escapeHtml(item.last_message||'')}</p></div>`).join(''):'<div class="empty">暂无转人工会话</div>';$('memories').innerHTML=memories.length?memories.map(item=>`<div class="queue-item"><span class="tag ${item.status}">${item.status==='candidate'?'待审核':escapeHtml(item.status)}</span>${escapeHtml(item.content)}<p class="queue-meta">客户：${escapeHtml(item.name||'未命名')}</p>${item.status==='candidate'?`<div class="item-actions"><button class="primary" type="button" data-memory="${item.memory_id}" data-action="approve">确认</button><button class="secondary" type="button" data-memory="${item.memory_id}" data-action="reject">拒绝</button></div>`:''}</div>`).join(''):'<div class="empty">暂无客户记忆</div>';$('knowledge').innerHTML=knowledge.map(item=>`<div class="knowledge-item"><b>${escapeHtml(item.title)}</b><p>${escapeHtml(item.content)}</p></div>`).join('')}catch(error){console.error(error)}}
    async function addKnowledge(){const title=$('knowledgeTitle').value.trim(),content=$('knowledgeContent').value.trim();if(!title||!content)return;await api('/api/knowledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,content})});$('knowledgeTitle').value='';$('knowledgeContent').value='';refresh()}
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));document.querySelectorAll('[data-question]').forEach(button=>button.addEventListener('click',()=>{$('input').value=button.dataset.question;$('input').focus()}));$('sendButton').addEventListener('click',send);$('input').addEventListener('keydown',event=>{if(event.key==='Enter')send()});$('knowledgeButton').addEventListener('click',addKnowledge);document.addEventListener('click',async event=>{const target=event.target;if(target.dataset.task){await api(`/api/tasks/${target.dataset.task}/complete`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()}if(target.dataset.memory){await api(`/api/memories/${target.dataset.memory}/${target.dataset.action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()}});refresh();
  </script>
</body>
</html>
