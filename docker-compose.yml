services:
  ai-customer-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      STORE_AI_ENV: ${STORE_AI_ENV:-development}
      STORE_AI_HOST: 0.0.0.0
      STORE_AI_PORT: 8000
      STORE_AI_ALLOWED_ORIGINS: ${STORE_AI_ALLOWED_ORIGINS:-http://127.0.0.1:8000}
      STORE_AI_MAX_BODY_BYTES: ${STORE_AI_MAX_BODY_BYTES:-262144}
      STORE_AI_LOG_LEVEL: ${STORE_AI_LOG_LEVEL:-INFO}
      STAFF_ACCESS_KEY: ${STAFF_ACCESS_KEY:-}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_APP_SECRET: ${WECOM_APP_SECRET:-}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_CALLBACK_AES_KEY: ${WECOM_CALLBACK_AES_KEY:-}
      WECOM_KF_OPEN_ID: ${WECOM_KF_OPEN_ID:-}
      WECOM_API_BASE_URL: ${WECOM_API_BASE_URL:-https://qyapi.weixin.qq.com}
      WECOM_HTTP_TIMEOUT_SECONDS: ${WECOM_HTTP_TIMEOUT_SECONDS:-5}
      WECOM_INTERNAL_GROUP_WEBHOOK: ${WECOM_INTERNAL_GROUP_WEBHOOK:-}
      # Optional OpenAI-compatible model configuration:
      # LLM_API_KEY: ${LLM_API_KEY}
      # LLM_BASE_URL: https://api.deepseek.com/v1
      # LLM_MODEL: deepseek-chat
    volumes:
      - ./runtime:/app/runtime
